<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Enzo Sery — full-stack developer, Strasbourg">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <style>.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}</style>
  </defs>

  <rect width="900" height="300" fill="#0d1117"/>
  <ellipse cx="150" cy="150" rx="340" ry="190" fill="url(#glow)"/>

  <g opacity="0.4">
    <circle cx="828" cy="76" r="2.2" fill="#22d3ee">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="856" cy="150" r="1.6" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.25;1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="222" r="1.3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(148, 150) scale(0.78)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 22; 0 0" dur="0.9s" begin="0.1s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1"/>

      <path d="M -53,-17 Q -73,-20 -73,-31 Q -73,-42 -59,-42 L -50,-37 Q -59,-34 -59,-28 Q -59,-22 -50,-21 Z" fill="#c4b5fd"/>

      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 59 -31; 40 59 -31; -8 59 -31; 36 59 -31; -6 59 -31; 30 59 -31; 0 59 -31; 0 59 -31"
          keyTimes="0; 0.06; 0.12; 0.18; 0.24; 0.30; 0.38; 1"
          dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
        <path d="M 53,-17 Q 73,-20 73,-31 Q 73,-42 59,-42 L 50,-37 Q 59,-34 59,-28 Q 59,-22 50,-21 Z" fill="#c4b5fd"/>
      </g>
      <ellipse cx="-45" cy="28" rx="6" ry="11" fill="#c4b5fd" transform="rotate(-15 -45 28)"/>
      <ellipse cx="-31" cy="34" rx="6" ry="11" fill="#c4b5fd" transform="rotate(-5 -31 34)"/>
      <ellipse cx="45" cy="28" rx="6" ry="11" fill="#c4b5fd" transform="rotate(15 45 28)"/>
      <ellipse cx="31" cy="34" rx="6" ry="11" fill="#c4b5fd" transform="rotate(5 31 34)"/>
      <path d="M -48,-3 Q -48,-31 0,-31 Q 48,-31 48,-3 Q 48,22 0,22 Q -48,22 -48,-3 Z" fill="#c4b5fd"/>
      <ellipse cx="-15" cy="-10" rx="10" ry="13" fill="#ffffff"/>
      <ellipse cx="15" cy="-10" rx="10" ry="13" fill="#ffffff"/>
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 0; -1.8 0; -1.8 0; 0 0"
          keyTimes="0; 0.04; 0.12; 0.30; 0.38"
          dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
        <circle cx="-14" cy="-8" r="6" fill="#1a1a1a"/>
        <circle cx="17" cy="-8" r="6" fill="#1a1a1a"/>
        <circle cx="-12" cy="-11" r="2" fill="#ffffff"/>
        <circle cx="19" cy="-11" r="2" fill="#ffffff"/>
      </g>
      <ellipse cx="-15" cy="-10" rx="10.5" ry="13.5" fill="#c4b5fd" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.62;0.647;0.674;1" dur="4.1s" begin="1.9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="15" cy="-10" rx="10.5" ry="13.5" fill="#c4b5fd" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.62;0.647;0.674;1" dur="4.1s" begin="1.9s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <g class="mono" font-size="12" letter-spacing="4" fill="#7d8590" opacity="0">
    <text x="300" y="112">STRASBOURG &#183; FRANCE</text>
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.35s" fill="freeze"/>
  </g>

  <g class="mono" font-size="54" font-weight="700" letter-spacing="2" fill="url(#sheen)">
    <text x="300" y="176" opacity="0">ENZO
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 20; 0 0" dur="0.9s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>
    <text x="459" y="176" opacity="0">SERY
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 20; 0 0" dur="0.9s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>
  </g>

  <rect x="300" y="202" width="0" height="2" fill="url(#rule)" rx="1">
    <animate attributeName="width" values="0;380" dur="1.1s" begin="0.9s" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>

  <g class="mono" font-size="15" fill="#c9d1d9">
    <text x="300" y="240" opacity="0">full-stack
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="404" y="240" fill="#6e7681" opacity="0">&#183;
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.3s" fill="freeze"/>
    </text>
    <text x="424" y="240" opacity="0">motion
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.35s" fill="freeze"/>
    </text>
    <text x="512" y="240" fill="#6e7681" opacity="0">&#183;
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.45s" fill="freeze"/>
    </text>
    <text x="532" y="240" fill="#8b949e" opacity="0">rust-curious
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
    </text>
    <rect x="654" y="228" width="8" height="16" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.65s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" begin="1.75s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
